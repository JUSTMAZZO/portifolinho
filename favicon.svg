<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo escuro -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <!-- Órbitas do átomo e núcleo com brilho neon -->
  <g stroke="#00FF00" stroke-width="3" fill="none" style="filter: drop-shadow(0px 0px 5px #00FF00);">
    <ellipse cx="32" cy="32" rx="10" ry="26" transform="rotate(45 32 32)"/>
    <ellipse cx="32" cy="32" rx="10" ry="26" transform="rotate(-45 32 32)"/>
    <ellipse cx="32" cy="32" rx="10" ry="26" transform="rotate(90 32 32)"/>
    <circle cx="32" cy="32" r="5" fill="#00FF00"/>
  </g>
</svg>
